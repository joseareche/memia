<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f5f2">
<title>Memia — acceso</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/chat/static/app.css"></head>
<body class="login-page">
<main class="login-card">
  <img class="login-logo" src="/chat/static/logo-mark.png" alt="Memia" width="520" height="372">
  <h1>Memia <span class="accent">· AI</span></h1>
  <p class="muted">Asistente privado de Memia. Inicia sesión para continuar.</p>
  <p id="err" class="err" hidden>No se pudo iniciar sesión. Inténtalo de nuevo.</p>
  <a class="btn btn-google" href="/chat/auth/google/start">
    <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.6 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
    Continuar con Google</a>
  <details class="fallback"><summary>Acceso con contraseña</summary>
    <form method="post" action="/chat/login" autocomplete="on">
      <label>Usuario <input name="username" autocomplete="username" required></label>
      <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form></details>
  <p class="fine">Acceso restringido. Tu historial de conversaciones se guarda de forma privada en tu cuenta.</p>
</main>
<script src="/chat/static/app.js"></script></body></html>
